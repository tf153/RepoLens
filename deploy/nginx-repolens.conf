# RepoLens edge on port 80 (standard HTTP) so no non-standard ports are needed.
#   /       -> Next.js frontend  (127.0.0.1:3000)
#   /api/   -> FastAPI backend   (127.0.0.1:8000)   e.g. http://<ip>/api/health
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 12m;          # diagram uploads
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;           # Gemma 4 tour/diagram calls can take a while
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
